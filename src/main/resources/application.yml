spring:
  application:
    name: crossword2
  datasource:
    url: jdbc:h2:mem:crossword2;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
app:
  auth:
    jwt-secret: ${JWT_SECRET:}
  feedback:
    upload-dir: ${UPLOAD_DIR:./data/uploads}
